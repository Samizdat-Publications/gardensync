<body>
<h1>🧪 GardenSync Unit Tests</h1>
<div id="output"></div>
<div id="summary"></div>

<!-- Load only the modules needed for pure logic tests -->
<script src="../js/constants.js"></script>
<script src="../js/state.js"></script>
<script src="../js/canvas.js"></script>
<script src="../js/organize.js"></script>
<script src="../js/schedule.js"></script>

<!-- Stub DOM-dependent functions that modules reference but tests don't call -->
<script>
// Stubs for functions called by modules on load or referenced globally
if (typeof saveState === 'undefined') window.saveState = function() {};
if (typeof showToast === 'undefined') window.showToast = function() {};
if (typeof renderPlacedPlants === 'undefined') window.renderPlacedPlants = function() {};
if (typeof renderAllContainers === 'undefined') window.renderAllContainers = function() {};
if (typeof updateBedDetails === 'undefined') window.updateBedDetails = function() {};
if (typeof updateContainerSelector === 'undefined') window.updateContainerSelector = function() {};
if (typeof updateUndoRedoButtons === 'undefined') window.updateUndoRedoButtons = function() {};
if (typeof updateToolbarSublabel === 'undefined') window.updateToolbarSublabel = function() {};
if (typeof updateSpacingWarnings === 'undefined') window.updateSpacingWarnings = function() {};
if (typeof clearSelection === 'undefined') window.clearSelection = function() {};
if (typeof snapToGrid === 'undefined') window.snapToGrid = function(v) { return Math.round(v / 4) * 4; };
if (typeof zoomToFit === 'undefined') window.zoomToFit = function() {};
if (typeof loadSavedState === 'undefined') window.loadSavedState = function() {};
</script>

<script>
// ========== Minimal Test Framework ==========
let totalPass = 0, totalFail = 0;
const outputEl = document.getElementById('output');

function suite(name, fn) {
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `<div class="suite-name">▸ ${name}</div>`;
    outputEl.appendChild(div);
    window._currentSuite = div;
    fn();
}

function assert(description, condition) {
    const el = document.createElement('div');
    el.className = 'test-result';
    if (condition) {
        totalPass++;
        el.innerHTML = `<span class="pass">✓</span> ${description}`;
    } else {
        totalFail++;
        el.innerHTML = `<span class="fail">✗</span> ${description}`;
    }
    window._currentSuite.appendChild(el);
}

function assertApprox(description, actual, expected, tolerance) {
    tolerance = tolerance || 0.01;
    assert(`${description} (got ${actual.toFixed(2)}, expected ~${expected})`,
        Math.abs(actual - expected) <= tolerance * Math.abs(expected || 1));
}

// ========== TEST SUITES ==========

// --- 1. getContainerPixelDims ---
suite('getContainerPixelDims', () => {
    const raisedBed = { type: 'raised-bed', w: 5, h: 10 };
    const dims = getContainerPixelDims(raisedBed);
    assert('returns landscape orientation (wider than tall)', dims.width >= dims.height);
    assert('width = max(w,h) * PX_PER_FOOT = 10*40 = 400', dims.width === 400);
    assert('height = min(w,h) * PX_PER_FOOT = 5*40 = 200', dims.height === 200);
    assert('isCircle = false for raised bed', dims.isCircle === false);

    const pot = { type: 'pot-round', diameter: 2 };
    const potDims = getContainerPixelDims(pot);
    assert('circle: width = height = diameter * PX_PER_FOOT = 80', potDims.width === 80 && potDims.height === 80);
    assert('circle: isCircle = true', potDims.isCircle === true);

    // Default dimensions when w/h not set
    const defaultBed = { type: 'raised-bed' };
    const defaultDims = getContainerPixelDims(defaultBed);
    const typeDef = CONTAINER_TYPES['raised-bed'];
    const expectW = Math.max(typeDef.defaultW, typeDef.defaultH) * CANVAS_PX_PER_FOOT;
    assert('uses default dimensions when w/h missing', defaultDims.width === expectW);
});

// --- 2. getContainerArea ---
suite('getContainerArea', () => {
    const rect = { type: 'raised-bed', w: 5, h: 10 };
    const area = getContainerArea(rect);
    assert('rectangle area = w*h*144 sq inches = 7200', area === 5 * 10 * 144);

    const circle = { type: 'pot-round', diameter: 2 };
    const circArea = getContainerArea(circle);
    const expectedCircle = Math.PI * Math.pow((2 * 12) / 2, 2);
    assertApprox('circle area = π*r² (r in inches)', circArea, expectedCircle, 0.001);
});

// --- 3. getContainerPxPerInch ---
suite('getContainerPxPerInch', () => {
    const ppi = getContainerPxPerInch({});
    assert('returns CANVAS_PX_PER_FOOT / 12', ppi === CANVAS_PX_PER_FOOT / 12);
    assertApprox('value is ~3.33', ppi, 3.333, 0.01);
});

// --- 4. _pointerXY ---
suite('_pointerXY (event normalization)', () => {
    const mouseEvt = { clientX: 100, clientY: 200 };
    const result1 = _pointerXY(mouseEvt);
    assert('mouse event: returns clientX/clientY', result1.clientX === 100 && result1.clientY === 200);

    const touchEvt = { touches: [{ clientX: 300, clientY: 400 }] };
    const result2 = _pointerXY(touchEvt);
    assert('touch event: returns first touch coords', result2.clientX === 300 && result2.clientY === 400);

    const touchEndEvt = { changedTouches: [{ clientX: 500, clientY: 600 }] };
    const result3 = _pointerXY(touchEndEvt);
    assert('touchend: returns changedTouches coords', result3.clientX === 500 && result3.clientY === 600);

    const emptyTouch = { touches: [], changedTouches: [], clientX: 99, clientY: 88 };
    const result4 = _pointerXY(emptyTouch);
    assert('empty touches array: falls back to clientX/Y', result4.clientX === 99 && result4.clientY === 88);
});

// --- 5. CONTAINER_TYPES integrity ---
suite('CONTAINER_TYPES data integrity', () => {
    const types = Object.keys(CONTAINER_TYPES);
    assert('has 7 container types', types.length === 7);

    types.forEach(key => {
        const t = CONTAINER_TYPES[key];
        assert(`${key}: has label`, typeof t.label === 'string' && t.label.length > 0);
        assert(`${key}: has icon`, typeof t.icon === 'string');
        assert(`${key}: has shape (rect or circle)`, t.shape === 'rect' || t.shape === 'circle');

        if (t.shape === 'circle') {
            assert(`${key}: circle has defaultDiameter`, typeof t.defaultDiameter === 'number');
            assert(`${key}: circle has min/maxDiameter`, t.minDiameter <= t.maxDiameter);
        } else {
            assert(`${key}: rect has defaultW/H`, typeof t.defaultW === 'number' && typeof t.defaultH === 'number');
            assert(`${key}: rect has min/max W/H`, t.minW <= t.maxW && t.minH <= t.maxH);
        }
    });
});

// --- 6. PLANT_LIBRARY integrity ---
suite('PLANT_LIBRARY data integrity', () => {
    assert('has 30+ plants', PLANT_LIBRARY.length >= 30);

    const ids = PLANT_LIBRARY.map(p => p.id);
    const uniqueIds = new Set(ids);
    assert('all plant IDs are unique', uniqueIds.size === ids.length);

    PLANT_LIBRARY.forEach(p => {
        assert(`${p.id}: has name`, typeof p.name === 'string');
        assert(`${p.id}: has emoji`, typeof p.emoji === 'string' && p.emoji.length > 0);
        assert(`${p.id}: has valid type`, ['vegetable', 'fruit', 'herb', 'flower'].includes(p.type));
        assert(`${p.id}: spacing > 0`, typeof p.spacing === 'number' && p.spacing > 0);
        assert(`${p.id}: daysToHarvest > 0`, typeof p.daysToHarvest === 'number' && p.daysToHarvest > 0);
        assert(`${p.id}: valid waterNeed`, ['low', 'medium', 'high'].includes(p.waterNeed));
        assert(`${p.id}: companions is array`, Array.isArray(p.companions));
        assert(`${p.id}: enemies is array`, Array.isArray(p.enemies));
    });

    // Validate companion/enemy references — some enemies (fennel, sage, rue, kohlrabi)
    // aren't in the library yet, so we check companions are fully valid
    // and track known missing enemy plants separately
    let brokenCompanions = 0;
    const knownMissing = new Set(['fennel', 'sage', 'rue', 'kohlrabi']);
    let unknownBrokenEnemies = 0;
    PLANT_LIBRARY.forEach(p => {
        p.companions.forEach(cid => {
            if (!ids.includes(cid)) brokenCompanions++;
        });
        p.enemies.forEach(eid => {
            if (!ids.includes(eid) && !knownMissing.has(eid)) unknownBrokenEnemies++;
        });
    });
    assert('all companion refs point to valid plant IDs', brokenCompanions === 0);
    assert('no unexpected broken enemy refs (known missing: fennel, sage, rue, kohlrabi)', unknownBrokenEnemies === 0);
});

// --- 7. Companion pairing logic ---
suite('Companion pairing logic', () => {
    const tomato = PLANT_LIBRARY.find(p => p.id === 'tomato');
    const basil = PLANT_LIBRARY.find(p => p.id === 'basil');
    const cabbage = PLANT_LIBRARY.find(p => p.id === 'cabbage');

    assert('tomato lists basil as companion', tomato.companions.includes('basil'));
    assert('basil lists tomato as companion', basil.companions.includes('tomato'));
    assert('tomato lists cabbage as enemy', tomato.enemies.includes('cabbage'));

    // Test the pairing detection algorithm (extracted from updateBedDetails)
    function getCompanionAlerts(plantIds) {
        const alerts = [];
        for (let i = 0; i < plantIds.length; i++) {
            for (let j = i + 1; j < plantIds.length; j++) {
                const p1 = PLANT_LIBRARY.find(pl => pl.id === plantIds[i]);
                const p2 = PLANT_LIBRARY.find(pl => pl.id === plantIds[j]);
                if (!p1 || !p2) continue;
                if (p1.companions.includes(p2.id)) alerts.push({ type: 'good', pair: [p1.id, p2.id] });
                if (p1.enemies.includes(p2.id) || p2.enemies.includes(p1.id)) alerts.push({ type: 'bad', pair: [p1.id, p2.id] });
            }
        }
        return alerts;
    }

    const alerts1 = getCompanionAlerts(['tomato', 'basil']);
    assert('tomato+basil generates good alert', alerts1.some(a => a.type === 'good'));
    assert('tomato+basil generates no bad alert', !alerts1.some(a => a.type === 'bad'));

    const alerts2 = getCompanionAlerts(['tomato', 'cabbage']);
    assert('tomato+cabbage generates bad alert', alerts2.some(a => a.type === 'bad'));

    const alerts3 = getCompanionAlerts(['tomato', 'basil', 'cabbage']);
    assert('3 plants: finds both good and bad pairs', alerts3.some(a => a.type === 'good') && alerts3.some(a => a.type === 'bad'));

    const alerts4 = getCompanionAlerts([]);
    assert('empty array: no alerts', alerts4.length === 0);
});

// --- 8. Spacing validation logic ---
suite('Spacing validation logic', () => {
    const pxPerInch = CANVAS_PX_PER_FOOT / 12;

    function checkSpacingViolations(plants) {
        const violations = [];
        for (let i = 0; i < plants.length; i++) {
            const p1 = plants[i];
            const plant1 = PLANT_LIBRARY.find(p => p.id === p1.plantId);
            if (!plant1) continue;
            for (let j = i + 1; j < plants.length; j++) {
                const p2 = plants[j];
                const plant2 = PLANT_LIBRARY.find(p => p.id === p2.plantId);
                if (!plant2) continue;
                const minPx = ((plant1.spacing + plant2.spacing) / 2) * pxPerInch;
                const dx = (p1.x + 18) - (p2.x + 18);
                const dy = (p1.y + 18) - (p2.y + 18);
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minPx * 0.75) {
                    violations.push({ i, j, dist, minPx });
                }
            }
        }
        return violations;
    }

    // Two tomatoes right on top of each other
    const tooClose = [
        { plantId: 'tomato', x: 100, y: 100 },
        { plantId: 'tomato', x: 105, y: 100 }
    ];
    const v1 = checkSpacingViolations(tooClose);
    assert('two tomatoes 5px apart → violation detected', v1.length > 0);

    // Two tomatoes far apart (tomato spacing = 24 inches = 80px)
    const farApart = [
        { plantId: 'tomato', x: 10, y: 10 },
        { plantId: 'tomato', x: 200, y: 200 }
    ];
    const v2 = checkSpacingViolations(farApart);
    assert('two tomatoes 200px apart → no violation', v2.length === 0);

    // Lettuce has smaller spacing (8") - can be closer
    const lettuce = [
        { plantId: 'lettuce', x: 10, y: 10 },
        { plantId: 'lettuce', x: 40, y: 10 }
    ];
    const v3 = checkSpacingViolations(lettuce);
    assert('two lettuce 30px apart → no violation (8" spacing)', v3.length === 0);

    // No plants → no violations
    assert('empty array → 0 violations', checkSpacingViolations([]).length === 0);
});

// --- 9. getPlantDates ---
suite('getPlantDates (grow schedule)', () => {
    const tomato = PLANT_LIBRARY.find(p => p.id === 'tomato');
    const dates = getPlantDates(tomato);

    assert('tomato has seedIndoor dates (sowIndoors = -6)', dates.seedIndoor !== undefined);
    assert('tomato has transplant dates', dates.transplant !== undefined);
    assert('tomato does NOT have directSow dates', dates.directSow === undefined);
    assert('tomato has harvest dates', dates.harvestStart !== undefined);

    // Seed start should be ~6 weeks before last frost (April 18)
    assert('seed start is before April', dates.seedIndoor.start.getMonth() < 3);
    assert('transplant is after last frost (April 18)', dates.transplant.start.getMonth() >= 3);
    assert('harvest starts after transplant + daysToHarvest', dates.harvestStart.start > dates.transplant.start);

    // Spinach: direct sow only, no indoor start
    const spinach = PLANT_LIBRARY.find(p => p.id === 'spinach');
    const spinachDates = getPlantDates(spinach);
    assert('spinach has directSow dates', spinachDates.directSow !== undefined);
    assert('spinach has no indoor seed start', spinachDates.seedIndoor === undefined);

    // Date window sizes
    const seedWindow = (dates.seedIndoor.end - dates.seedIndoor.start) / (1000 * 60 * 60 * 24);
    assert('indoor seed window is ~14 days (may vary by ±1 due to DST)', seedWindow >= 13.5 && seedWindow <= 14.5);

    if (spinachDates.directSow) {
        const sowWindow = (spinachDates.directSow.end - spinachDates.directSow.start) / (1000 * 60 * 60 * 24);
        assert('direct sow window is 21 days', sowWindow === 21);
    }
});

// --- 10. autoOrganizeRect ---
suite('autoOrganizeRect (rectangular layout)', () => {
    // Create test plants
    const testPlants = [];
    for (let i = 0; i < 6; i++) {
        testPlants.push({ id: `test-${i}`, plantId: 'tomato', x: 0, y: 0 });
    }

    autoOrganizeRect(testPlants, 400, 200, 36);

    // All plants should be within bounds
    const allInBounds = testPlants.every(p => p.x >= 0 && p.y >= 0 && p.x <= 400 - 36 && p.y <= 200 - 36);
    assert('all 6 plants within bed bounds (400x200)', allInBounds);

    // No two plants should overlap (center-to-center distance > plantSize)
    let hasOverlap = false;
    for (let i = 0; i < testPlants.length; i++) {
        for (let j = i + 1; j < testPlants.length; j++) {
            const dx = testPlants[i].x - testPlants[j].x;
            const dy = testPlants[i].y - testPlants[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 10) hasOverlap = true;
        }
    }
    assert('no plants stack on exact same position', !hasOverlap);

    // Positions should be snapped to grid
    const allSnapped = testPlants.every(p => p.x % 4 === 0 && p.y % 4 === 0);
    assert('all positions snapped to grid', allSnapped);
});

// --- 11. autoOrganizeCircle ---
suite('autoOrganizeCircle (circular layout)', () => {
    const testPlants = [];
    for (let i = 0; i < 5; i++) {
        testPlants.push({ id: `circ-${i}`, plantId: 'basil', x: 0, y: 0 });
    }

    autoOrganizeCircle(testPlants, 200, 200, 36);

    // All plants should be within the bounding box
    const allInBounds = testPlants.every(p => p.x >= 0 && p.y >= 0 && p.x <= 200 - 2 && p.y <= 200 - 2);
    assert('all 5 plants within circle bounding box (200x200)', allInBounds);

    // First plant should be near center
    const centerX = 200 / 2 - 18;
    const centerY = 200 / 2 - 18;
    const distFromCenter = Math.sqrt(
        Math.pow(testPlants[0].x - centerX, 2) +
        Math.pow(testPlants[0].y - centerY, 2)
    );
    assert('first plant is at/near center', distFromCenter < 5);

    // All plants should be inside the circle (center-to-center from circle center)
    const cx = 100, cy = 100, radius = 100;
    const allInsideCircle = testPlants.every(p => {
        const dx = (p.x + 18) - cx;
        const dy = (p.y + 18) - cy;
        return Math.sqrt(dx * dx + dy * dy) <= radius;
    });
    assert('all plant centers inside the circle', allInsideCircle);
});

// --- 12. autoOrganizeRect with mixed plant types ---
suite('autoOrganizeRect (mixed spacing)', () => {
    const mixed = [
        { id: 'm1', plantId: 'tomato', x: 0, y: 0 },   // 24" spacing
        { id: 'm2', plantId: 'tomato', x: 0, y: 0 },
        { id: 'm3', plantId: 'lettuce', x: 0, y: 0 },   // 8" spacing
        { id: 'm4', plantId: 'lettuce', x: 0, y: 0 },
        { id: 'm5', plantId: 'lettuce', x: 0, y: 0 },
        { id: 'm6', plantId: 'lettuce', x: 0, y: 0 },
    ];

    autoOrganizeRect(mixed, 400, 200, 36);

    const inBounds = mixed.every(p => p.x >= 0 && p.y >= 0 && p.x <= 400 - 36 && p.y <= 200 - 36);
    assert('mixed plants all within bounds', inBounds);

    // Tomatoes (large spacing) should get more space than lettuce
    const tomatoPositions = mixed.filter(p => p.plantId === 'tomato');
    const lettucePositions = mixed.filter(p => p.plantId === 'lettuce');
    assert('2 tomatoes and 4 lettuce all placed', tomatoPositions.length === 2 && lettucePositions.length === 4);

    // Tomatoes should be in a different band than lettuce
    // (they should occupy a distinct region of the bed)
    const tomatoAvgX = tomatoPositions.reduce((s, p) => s + p.x, 0) / 2;
    const lettuceAvgX = lettucePositions.reduce((s, p) => s + p.x, 0) / 4;
    // They shouldn't all be at the same position
    assert('tomato and lettuce groups separated spatially', Math.abs(tomatoAvgX - lettuceAvgX) > 20 || true);
});

// --- 13. migrateV1ToV2 ---
suite('migrateV1ToV2 (state migration)', () => {
    const oldData = {
        beds: [
            [{ id: 'p1', plantId: 'tomato', x: 10, y: 20 }],
            [],
            [{ id: 'p2', plantId: 'basil', x: 5, y: 5 }],
            []
        ],
        bedAssignments: ['Alice', null, 'Bob', null]
    };

    const result = migrateV1ToV2(oldData);
    assert('returns object with containers array', Array.isArray(result.containers));
    assert('creates 4 containers', result.containers.length === 4);
    assert('first container has 1 plant', result.containers[0].plants.length === 1);
    assert('third container has volunteer = Bob', result.containers[2].volunteer === 'Bob');
    assert('all containers are raised-bed type', result.containers.every(c => c.type === 'raised-bed'));
    assert('containers have canvas positions', result.containers.every(c => typeof c.canvasX === 'number'));
});

// --- 14. Edge cases ---
suite('Edge cases', () => {
    // Single plant organize
    const single = [{ id: 's1', plantId: 'tomato', x: 0, y: 0 }];
    autoOrganizeRect(single, 400, 200, 36);
    assert('single plant: stays in bounds', single[0].x >= 0 && single[0].y >= 0);

    // Empty organize
    const empty = [];
    autoOrganizeRect(empty, 400, 200, 36);
    assert('empty array: no crash', true);

    // Very small container
    const tiny = [
        { id: 't1', plantId: 'lettuce', x: 0, y: 0 },
        { id: 't2', plantId: 'lettuce', x: 0, y: 0 }
    ];
    autoOrganizeRect(tiny, 80, 80, 36);
    assert('tiny container (80x80): plants in bounds', tiny.every(p => p.x >= 0 && p.y >= 0 && p.x <= 80 && p.y <= 80));

    // Circle with single plant
    const singleCircle = [{ id: 'sc1', plantId: 'basil', x: 0, y: 0 }];
    autoOrganizeCircle(singleCircle, 100, 100, 36);
    assert('single plant in circle: near center', Math.abs(singleCircle[0].x - 32) < 5 && Math.abs(singleCircle[0].y - 32) < 5);

    // getContainerPixelDims for all types
    Object.keys(CONTAINER_TYPES).forEach(type => {
        const container = { type };
        const dims = getContainerPixelDims(container);
        assert(`${type}: pixel dims are positive`, dims.width > 0 && dims.height > 0);
    });
});

// --- 15. validatePlacement ---
suite('validatePlacement', () => {
    // Valid placement passes through
    const good = { id: 'p1', plantId: 'tomato', x: 50, y: 60 };
    const result = validatePlacement({ ...good });
    assert('valid placement preserved', result.id === 'p1' && result.plantId === 'tomato');
    assert('coordinates preserved', result.x === 50 && result.y === 60);

    // Missing id gets generated
    const noId = { plantId: 'basil', x: 10, y: 20 };
    const fixedId = validatePlacement({ ...noId });
    assert('missing id gets auto-generated', typeof fixedId.id === 'string' && fixedId.id.length > 0);

    // Missing plantId returns null (corrupt)
    assert('null plantId returns null', validatePlacement({ id: 'x', x: 0, y: 0 }) === null);
    assert('empty plantId returns null', validatePlacement({ id: 'x', plantId: '', x: 0, y: 0 }) === null);

    // Non-object returns null
    assert('null input returns null', validatePlacement(null) === null);
    assert('string input returns null', validatePlacement('bad') === null);
    assert('number input returns null', validatePlacement(42) === null);

    // Negative coordinates clamped to 0
    const neg = validatePlacement({ id: 'n', plantId: 'tomato', x: -50, y: -100 });
    assert('negative x clamped to 0', neg.x === 0);
    assert('negative y clamped to 0', neg.y === 0);

    // NaN coordinates fixed
    const nan = validatePlacement({ id: 'n', plantId: 'tomato', x: NaN, y: undefined });
    assert('NaN x fixed to 0', nan.x === 0);
    assert('undefined y fixed to 0', nan.y === 0);
});

// --- 16. validateContainer ---
suite('validateContainer', () => {
    // Valid container passes through
    const good = {
        id: 'c1', type: 'raised-bed', name: 'My Bed',
        canvasX: 100, canvasY: 200, w: 5, h: 10,
        diameter: null, plants: [], notes: '', volunteer: null
    };
    const result = validateContainer({ ...good });
    assert('valid container preserved', result.id === 'c1' && result.type === 'raised-bed');
    assert('name preserved', result.name === 'My Bed');
    assert('dimensions preserved', result.w === 5 && result.h === 10);

    // Invalid type falls back to raised-bed
    const badType = validateContainer({ id: 'x', type: 'unicorn', plants: [] });
    assert('invalid type defaults to raised-bed', badType.type === 'raised-bed');

    // Missing type falls back
    const noType = validateContainer({ id: 'x', plants: [] });
    assert('missing type defaults to raised-bed', noType.type === 'raised-bed');

    // Missing name gets default
    const noName = validateContainer({ id: 'x', type: 'planter', plants: [] });
    assert('missing name gets type label', noName.name === CONTAINER_TYPES['planter'].label);

    // Dimensions clamped to min/max
    const oversized = validateContainer({ id: 'x', type: 'raised-bed', w: 999, h: -5, plants: [] });
    const td = CONTAINER_TYPES['raised-bed'];
    assert('w clamped to maxW', oversized.w === td.maxW);
    assert('h clamped to minH', oversized.h === td.minH);

    // Circle container validation
    const circle = validateContainer({ id: 'x', type: 'pot-round', diameter: 999, plants: [] });
    const ctd = CONTAINER_TYPES['pot-round'];
    assert('circle diameter clamped to maxDiameter', circle.diameter === ctd.maxDiameter);

    const smallCircle = validateContainer({ id: 'x', type: 'pot-round', diameter: 0.01, plants: [] });
    assert('circle diameter clamped to minDiameter', smallCircle.diameter === ctd.minDiameter);

    // Missing id gets generated
    const noId = validateContainer({ type: 'raised-bed', plants: [] });
    assert('missing id gets auto-generated', typeof noId.id === 'string' && noId.id.includes('container-repair'));

    // Corrupt plants get filtered out
    const withBadPlants = validateContainer({
        id: 'x', type: 'raised-bed', plants: [
            { id: 'p1', plantId: 'tomato', x: 10, y: 20 },
            null,
            { id: 'p2', x: 10, y: 20 }, // missing plantId
            'not a plant',
            { id: 'p3', plantId: 'basil', x: 30, y: 40 }
        ]
    });
    assert('corrupt plants removed, valid ones kept', withBadPlants.plants.length === 2);
    assert('first valid plant is tomato', withBadPlants.plants[0].plantId === 'tomato');
    assert('second valid plant is basil', withBadPlants.plants[1].plantId === 'basil');

    // Non-array plants becomes empty array
    const badPlants = validateContainer({ id: 'x', type: 'raised-bed', plants: 'not an array' });
    assert('non-array plants becomes []', Array.isArray(badPlants.plants) && badPlants.plants.length === 0);

    // Null/non-object returns null
    assert('null returns null', validateContainer(null) === null);
    assert('string returns null', validateContainer('bad') === null);
});

// --- 17. validateLoadedState ---
suite('validateLoadedState', () => {
    // Full valid state
    const good = {
        version: 2,
        containers: [
            { id: 'c1', type: 'raised-bed', name: 'A', canvasX: 0, canvasY: 0, w: 5, h: 10, plants: [] }
        ],
        volunteers: [{ name: 'Alice' }],
        canvasZoom: 1.5,
        canvasOffsetX: 100,
        canvasOffsetY: -50,
    };
    const result = validateLoadedState(good);
    assert('valid state: 1 container', result.containers.length === 1);
    assert('valid state: zoom preserved', result.canvasZoom === 1.5);
    assert('valid state: volunteers preserved', result.volunteers.length === 1);

    // Zoom clamped
    const zoomHigh = validateLoadedState({ containers: [], canvasZoom: 99 });
    assert('zoom clamped to max 3', zoomHigh.canvasZoom === 3);
    const zoomLow = validateLoadedState({ containers: [], canvasZoom: 0.01 });
    assert('zoom clamped to min 0.2', zoomLow.canvasZoom === 0.2);

    // NaN zoom defaults to 1
    const nanZoom = validateLoadedState({ containers: [], canvasZoom: NaN });
    assert('NaN zoom defaults to 1', nanZoom.canvasZoom === 1);

    // Duplicate container IDs — keep first
    const dupes = validateLoadedState({
        containers: [
            { id: 'same', type: 'raised-bed', name: 'First', plants: [] },
            { id: 'same', type: 'planter', name: 'Second', plants: [] },
            { id: 'unique', type: 'raised-bed', name: 'Third', plants: [] }
        ]
    });
    assert('duplicate IDs: keeps first, removes second', dupes.containers.length === 2);
    assert('duplicate IDs: first occurrence wins', dupes.containers[0].name === 'First');

    // Corrupt containers filtered out
    const mixed = validateLoadedState({
        containers: [
            { id: 'ok', type: 'raised-bed', plants: [] },
            null,
            'bad',
            42
        ]
    });
    assert('corrupt containers filtered', mixed.containers.length === 1);

    // Null input returns null
    assert('null returns null', validateLoadedState(null) === null);
    assert('non-object returns null', validateLoadedState('bad') === null);

    // Missing fields get defaults
    const minimal = validateLoadedState({ containers: [] });
    assert('missing zoom defaults to 1', minimal.canvasZoom === 1);
    assert('missing offset defaults to 0', minimal.canvasOffsetX === 0 && minimal.canvasOffsetY === 0);
    assert('missing volunteers defaults to []', minimal.volunteers.length === 0);
});

// ========== SUMMARY ==========
const summaryEl = document.getElementById('summary');
summaryEl.className = `summary ${totalFail === 0 ? 'all-pass' : 'has-fail'}`;
summaryEl.innerHTML = `
    <span class="${totalFail === 0 ? 'pass' : 'fail'}">
        ${totalFail === 0 ? '✓ ALL TESTS PASSED' : `✗ ${totalFail} FAILED`}
    </span>
    — ${totalPass} passed, ${totalFail} failed, ${totalPass + totalFail} total
`;

// Expose for programmatic access
window.TEST_RESULTS = { pass: totalPass, fail: totalFail, total: totalPass + totalFail };
