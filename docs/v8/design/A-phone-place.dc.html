<head>

<title>GardenSync on a phone: placing bush beans</title>

</head>
<body>
<x-dc>

<style>

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EDF0E7; color: #1C231D; font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<symbol id="q-pod" viewBox="0 0 24 24"><path d="M3.5 19 Q6 8 20 4.5 Q14.5 16 3.5 19 Z" fill="currentColor"></path><g fill="#ffffff" opacity="0.45"><circle cx="8.8" cy="14.6" r="1.4"></circle><circle cx="12.4" cy="11.8" r="1.4"></circle><circle cx="15.7" cy="9" r="1.3"></circle></g></symbol>

</defs></svg>
<div style="padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Bed 2, 3 by 8 ft</span>
<span style="font-size: 14px; color: #4D584E">Tap squares to plant bush beans. Tap again to clear one.</span>
</div>
<svg viewBox="0 0 390 420" role="img" aria-label="Bed 2 grid: 4 squares chosen for bush beans, 6 squares taken, the rest free" style="display: block; width: 390px; height: 420px">
<g transform="translate(87 6)">
<rect x="-6" y="-6" width="228" height="420" rx="3" fill="#8E6B46"></rect>
<rect width="216" height="408" fill="url(#q-soil)"></rect>
<path d="M72 0 V408 M144 0 V408 M0 68 H216 M0 136 H216 M0 204 H216 M0 272 H216 M0 340 H216" stroke="rgba(70,50,30,0.30)"></path>
<rect x="2" y="2" width="140" height="202" rx="4" fill="#3A332B" opacity="0.45"></rect>
<text x="72" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="14" font-weight="700">Potatoes</text>
<text x="72" y="126" text-anchor="middle" fill="#FFFFFF" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="12">until Aug 20</text>
<rect x="146" y="2" width="68" height="202" rx="4" fill="#3A332B" opacity="0.45"></rect>
<text x="180" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="13" font-weight="700">Kale</text>
<rect x="2" y="206" width="140" height="132" rx="4" fill="#5aa36a" opacity="0.35"></rect>
<rect x="2" y="206" width="140" height="132" rx="4" fill="none" stroke="#FFFFFF" stroke-width="6"></rect>
<rect x="2" y="206" width="140" height="132" rx="4" fill="none" stroke="#1C231D" stroke-width="2.5"></rect>
<g style="color: #4a9a5a" stroke="#2B2A24" stroke-width="1"><svg x="10" y="214" width="22" height="22"><use href="#q-pod"></use></svg><svg x="34" y="214" width="22" height="22"><use href="#q-pod"></use></svg><svg x="82" y="214" width="22" height="22"><use href="#q-pod"></use></svg><svg x="106" y="214" width="22" height="22"><use href="#q-pod"></use></svg><svg x="10" y="282" width="22" height="22"><use href="#q-pod"></use></svg><svg x="82" y="282" width="22" height="22"><use href="#q-pod"></use></svg></g>
<rect x="146" y="206" width="68" height="200" rx="4" fill="none" stroke="#1C231D" stroke-width="2" stroke-dasharray="6 5"></rect>
<rect x="2" y="342" width="140" height="64" rx="4" fill="none" stroke="#1C231D" stroke-width="2" stroke-dasharray="6 5"></rect>

</svg>
<section aria-labelledby="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 20px; border-radius: 18px 18px 0 0; background: #FFFFFF; box-shadow: 0 -8px 24px rgba(20, 40, 20, 0.18); display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9CFC3"></span>
<div style="display: flex; gap: 12px; align-items: center">
<svg width="44" height="44" aria-hidden="true" style="color: #4a9a5a"><use href="#q-pod"></use></svg>
<div style="flex: 1 1 auto">
<h2 id="sheet" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Bush bean</h2>
<span style="font-size: 14px; color: #4D584E">9 per square. Sow from Apr 19, every 2 weeks.</span>
</div>
<button style="min-height: 40px; padding: 0 12px; border: 1px solid #D8DDD2; border-radius: 8px; background: #FFFFFF; font: inherit">Change</button>
</div>
<p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #F1F2EC; font-size: 14px"><strong>Grey squares are taken:</strong> potatoes until Aug 20, kale until Dec. Dashed squares are free all season.</p>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span>4 squares chosen</span><strong style="font-size: 18px">36 plants</strong></div>
<div style="display: flex; gap: 10px">
<button style="flex: 1 1 0; min-height: 50px; border: 1px solid #D8DDD2; border-radius: 10px; background: #FFFFFF; font: inherit; font-weight: 500">Cancel</button>
<button style="flex: 2 1 0; min-height: 50px; border: 0; border-radius: 10px; background: #2E7D46; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 16px">Plant 36 bush beans</button>
</div>
</section>
</div>
</x-dc>
