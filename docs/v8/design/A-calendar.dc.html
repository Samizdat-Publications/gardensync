<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GardenSync year calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E7D46}a:hover{color:#1F5C33}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #F3F4EF; color: #1C231D; font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 10px 20px; border-bottom: 1px solid #D8DDD2; background: #FFFFFF">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C231D"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="4" fill="#2E7D46"></rect><path d="M15 24 V14 M15 15 Q10 14 9 9 Q14 9.5 15 14 M15 13 Q19.5 11 21 7 Q16.5 7.5 15 12" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px">GardenSync</span></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; color: #4D584E; text-decoration: none">Garden</a>
<a href="A-week.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; color: #4D584E; text-decoration: none">This week</a>
<a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #E1EFE3; color: #1C231D; font-weight: 700; text-decoration: none">Calendar</a>
<a href="A-plants.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; color: #4D584E; text-decoration: none">Plants</a>
<a href="A-harvest.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; color: #4D584E; text-decoration: none">Harvest</a>
</nav>
<span style="font-size: 14px; color: #4D584E">Back garden, Portland, Oregon</span>
</header>

<main style="padding: 24px clamp(20px, 3vw, 40px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">2027 at a glance</h1>
<div role="group" aria-label="Year" style="display: flex; gap: 6px">
<button aria-label="Previous year" style="width: 40px; height: 40px; border: 1px solid #D8DDD2; border-radius: 8px; background: #FFFFFF; font: inherit">&#8249;</button>
<button aria-label="Next year" style="width: 40px; height: 40px; border: 1px solid #D8DDD2; border-radius: 8px; background: #FFFFFF; font: inherit">&#8250;</button>
</div>
<div style="flex: 1 1 auto"></div>
<button style="min-height: 44px; padding: 0 14px; border: 1px solid #D8DDD2; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500">Show as a list</button>
<button style="min-height: 44px; padding: 0 14px; border: 1px solid #D8DDD2; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500">Print the year</button>
<button style="min-height: 40px; padding: 0 14px; border: 1px solid #D8DDD2; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500">Add to my calendar app</button>
</div>

<div style="overflow-x: auto; border: 1px solid #D8DDD2; border-radius: 12px; background: #FFFFFF">
<div style="min-width: 1100px; padding: 12px 16px 16px">
<div style="display: grid; grid-template-columns: 170px 1fr; align-items: end; padding-bottom: 6px; border-bottom: 1px solid #D8DDD2">
<span></span>
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); font-size: 13px; color: #4D584E">
<span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
</div>
</div>
<div style="position: relative">
<div aria-hidden="true" style="position: absolute; left: 170px; right: 0; top: 0; bottom: 0">
<div style="position: absolute; top: 0; bottom: 0; left: 0; width: 21.9%; background: #DCE6F7; opacity: 0.6"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 21.9%; width: 6.3%; background: repeating-linear-gradient(45deg, #DCE6F7 0 5px, #C3D3F2 5px 8px); opacity: 0.8"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 83%; width: 5.7%; background: repeating-linear-gradient(45deg, #DCE6F7 0 5px, #C3D3F2 5px 8px); opacity: 0.8"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 88.7%; width: 11.3%; background: #DCE6F7; opacity: 0.6"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 28.5%; width: 2px; background: #1C231D"></div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="position: relative; padding-top: 10px">
<h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 700; color: #4D584E">{{g.name}}</h2>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 170px 1fr; align-items: center; min-height: 30px">
<span style="font-size: 14px">{{r.name}}</span>
<div style="position: relative; height: 16px">
<sc-for list="{{r.segs}}" as="s" hint-placeholder-count="2">
<span style="position: absolute; box-sizing: border-box; top: {{s.top}}; left: {{s.left}}; width: {{s.width}}; height: {{s.height}}; border-radius: 8px; background: {{s.bg}}; border: {{s.border}}"></span>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: #4D584E">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 0; border-top: 2px dashed #4D584E"></span>Seedlings indoors</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 12px; box-sizing: border-box; border-radius: 6px; border: 2px solid #4D584E; background: #FFFFFF"></span>Growing</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 12px; border-radius: 6px; background: #4D584E"></span>Ready to pick</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 12px; background: #DCE6F7"></span>Frost likely</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 12px; background: repeating-linear-gradient(45deg, #DCE6F7 0 5px, #C3D3F2 5px 8px)"></span>Frost possible</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 2px; height: 14px; background: #1C231D"></span>Today, Apr 15</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const pct = (d) => (d / 365 * 100).toFixed(2) + '%';
    // Growing is an outlined bar, picking a solid one, seedlings indoors a thin dashed line:
    // the stages differ in shape, not just in strength of colour.
    const seg = (color) => (a, b, kind) => ({
      left: pct(a), width: pct(b - a),
      top: kind === 'indoor' ? '6px' : '1px',
      height: kind === 'indoor' ? '4px' : '14px',
      bg: kind === 'harvest' ? color : kind === 'indoor' ? 'transparent' : '#FFFFFF',
      border: kind === 'indoor' ? '2px dashed ' + color : '2px solid ' + color
    });
    const row = (name, color, parts) => ({ name, color, segs: parts.map(([a, b, k]) => seg(color)(a, b, k)) });
    return {
      groups: [
        { name: 'Bed 1', rows: [
          row('Tomato', '#d64545', [[48, 104, 'indoor'], [112, 325, 'bed'], [174, 325, 'harvest']]),
          row('Basil', '#4f9d5a', [[95, 137, 'indoor'], [137, 288, 'bed'], [180, 288, 'harvest']]),
          row('Lettuce, 3 rounds', '#6fae3a', [[66, 200, 'bed'], [137, 200, 'harvest'], [221, 315, 'bed'], [268, 315, 'harvest']]),
          row('Carrot', '#e37b1c', [[105, 220, 'bed'], [175, 220, 'harvest']]),
          row('Garlic', '#9b8f6a', [[0, 190, 'bed'], [172, 190, 'harvest'], [294, 365, 'bed']]),
          row('Bush bean', '#4a9a5a', [[109, 235, 'bed'], [166, 235, 'harvest']])
        ]},
        { name: 'Bed 2', rows: [
          row('Peas', '#5aa36a', [[50, 170, 'bed'], [130, 170, 'harvest']]),
          row('Potato', '#a8865a', [[102, 232, 'bed'], [190, 232, 'harvest']]),
          row('Zucchini', '#5e9a2e', [[95, 116, 'indoor'], [116, 300, 'bed'], [165, 300, 'harvest']]),
          row('Kale', '#2e6b4f', [[40, 70, 'indoor'], [70, 340, 'bed'], [120, 340, 'harvest']])
        ]},
        { name: 'Pots', rows: [
          row('Pepper', '#2f9e6a', [[38, 104, 'indoor'], [112, 300, 'bed'], [200, 300, 'harvest']]),
          row('Mint', '#3d8f61', [[0, 365, 'bed'], [120, 290, 'harvest']]),
          row('Strawberry', '#d94f6a', [[0, 365, 'bed'], [140, 190, 'harvest']])
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
